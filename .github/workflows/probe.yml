name: m69b histserv memory probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        py: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lgray/graphed-histogram
          ref: m69b
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: |
          pip install -q "graphed[awkward,numpy]==0.0.6" graphed-executors -e "./repo[dev,histserv]" psutil
          sudo mkdir -p /p && sudo cp announce_db8fb0a.py /p/
      - run: |
          echo "HOST $(uname -m) nproc=$(nproc) $(python -VV | head -1) pandas=$(python -c 'import pandas; print(pandas.__version__)')"
          python probe_histserv_memory.py
